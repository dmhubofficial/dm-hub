<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMHub — Free Creator Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.hero,.card{background:#11151d;border:1px solid #252a36;border-radius:20px;padding:22px}
.hero{text-align:center}.hero h1{font-size:38px;margin:0}.hero span{color:#7c5cff}.sub{color:#aeb5c2;margin-top:8px}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid #303644;background:#151923;color:#ddd;padding:11px 14px;border-radius:12px;white-space:nowrap}.active{background:#7c5cff;color:white}
label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:120px;background:#0b0d12;color:#fff;border:1px solid #353b49;border-radius:12px;padding:13px;font-size:16px}
button{cursor:pointer;border:0;border-radius:12px;padding:13px;margin-top:12px;background:#7c5cff;color:#fff;font-weight:700;font-size:16px}.generate{width:100%}.copy{width:100%;background:#242a36}
.result{white-space:pre-wrap;line-height:1.6;margin-top:14px;background:#0b0d12;border:1px solid #252a36;border-radius:12px;padding:14px;min-height:90px}.small{color:#8f98a8;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>DM<span>Hub</span></h1><div class="sub">Free Creator Tools — No API Key Needed</div></div>
<div class="tabs">
<button class="tab active" onclick="setTool('titles',this)">Shorts Titles</button>
<button class="tab" onclick="setTool('caption',this)">Instagram Caption</button>
<button class="tab" onclick="setTool('hashtags',this)">Hashtags</button>
<button class="tab" onclick="setTool('hook',this)">Viral Hooks</button>
<button class="tab" onclick="setTool('description',this)">Description</button>
</div>
<div class="card">
<label id="label">Your video topic</label>
<textarea id="topic" placeholder="Example: Funny cat video"></textarea>
<button class="generate" onclick="generate()">Generate</button>
<button class="copy" onclick="copyResult()">Copy Result</button>
<div id="result" class="result">Your result will appear here...</div>
<div class="small">This free version uses creator templates. AI API can be added later.</div>
</div>
</div>
<script>
let tool='titles';
function setTool(t,el){tool=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('result').textContent='Your result will appear here...';}
function generate(){
 const x=(document.getElementById('topic').value.trim()||'your amazing video');let out='';
 if(tool==='titles')out=[`🔥 You Won't Believe This: ${x}`,`Wait For The Ending 😱 | ${x}`,`This Was Too Funny 😂 | ${x}`,`${x} But It Gets Better 🤯`,`POV: The Funniest ${x} 😂`,`The Ending Was Unexpected 😳 | ${x}`].join('\n');
 if(tool==='caption')out=`😂 ${x}\n\nSome moments are just too good not to share!\nWhich part was your favorite? 👇\n\nFollow for more 🔥`;
 if(tool==='hashtags'){let w=x.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,4);out=[...w.map(a=>'#'+a),'#shorts','#ytshorts','#viral','#trending','#fyp','#reels','#creator'].join(' ');}
 if(tool==='hook')out=['STOP SCROLLING! You need to see this 👀','I did NOT expect this to happen 😳','Wait till you see the ending… 🤯','Nobody was ready for this 😂','This might be the funniest thing today!'].join('\n');
 if(tool==='description')out=`${x} 🎬\n\nWatch till the end for the best moment! If you enjoyed it, like, comment and subscribe for more videos.\n\n#shorts #viral #trending`;
 document.getElementById('result').textContent=out;
}
function copyResult(){navigator.clipboard?.writeText(document.getElementById('result').textContent);}
</script>
<footer style="text-align:center;padding:28px 10px;color:#8f98a8;font-size:13px">
<a href="/about.html" style="color:#9a7cff;margin:0 8px">About</a>
<a href="/privacy.html" style="color:#9a7cff;margin:0 8px">Privacy Policy</a>
<a href="/contact.html" style="color:#9a7cff;margin:0 8px">Contact</a>
</footer></body>
</html>
